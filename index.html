<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{background:#f0f4f8;color:#333;overflow-x:hidden;}
/* SPLASH */
.splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#1a73e8;display:flex;justify-content:center;align-items:center;z-index:999;animation:fadeIn 1s ease forwards;}
.splash img{width:180px;height:180px;opacity:0;transform:translateY(40px) scale(0.9);animation:floatUp 1.5s ease forwards;}
@keyframes floatUp{0%{opacity:0;transform:translateY(50px) scale(0.8);}60%{opacity:1;transform:translateY(-10px) scale(1.05);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes fadeOut{to{opacity:0;transform:scale(0.95);visibility:hidden;}}

/* HEADER */
header{width:100%;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;background:#1a73e8;border-radius:0 0 20px 20px;box-shadow:0 6px 18px rgba(0,0,0,0.15);position:sticky;top:0;z-index:100;color:white;}
.logo-area{display:flex;align-items:center;gap:12px;}
.logo-area img{width:45px;height:45px;border-radius:12px;box-shadow:4px 4px 14px rgba(0,0,0,0.2),-4px -4px 14px rgba(255,255,255,0.3);}
.logo-title{font-family:"Montserrat",sans-serif;font-size:36px;font-weight:800;color:white;letter-spacing:1px;text-shadow:2px 2px 8px rgba(0,0,0,0.25);}
.nav-buttons{display:flex;gap:15px;}
.nav-buttons button{background:#e6f0ff;color:#1a73e8;border-radius:16px;padding:10px 20px;border:none;font-weight:600;cursor:pointer;box-shadow:6px 6px 16px rgba(0,0,0,0.06),-6px -6px 16px rgba(255,255,255,0.9);transition:all 0.3s ease;}
.nav-buttons button:hover{transform:translateY(-2px);box-shadow:8px 8px 20px rgba(0,0,0,0.12),-8px -8px 20px rgba(255,255,255,0.95);background:#1a73e8;color:white;}
.hamburger{font-size:28px;cursor:pointer;background:none;border:none;color:white;}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-350px;width:350px;height:100%;background:#f0f4f8;padding:25px;box-shadow:6px 6px 20px rgba(0,0,0,0.08),-6px -6px 20px rgba(255,255,255,0.95);border-radius:0 20px 20px 0;transition:left 0.3s ease;z-index:200;}
.sidebar.active{left:0;}
.sidebar h3{text-align:center;margin-bottom:15px;font-size:24px;color:#1a73e8;}
.sidebar label{display:block;margin-top:12px;font-size:14px;color:#555;}
.sidebar input{width:100%;padding:12px;margin-top:6px;border:none;border-radius:16px;background:#e6f0ff;box-shadow: inset 4px 4px 10px rgba(0,0,0,0.06),inset -4px -4px 10px rgba(255,255,255,0.95);outline:none;font-size:14px;transition:all 0.3s ease;}
.sidebar input:focus{box-shadow: inset 6px 6px 14px rgba(0,0,0,0.12),inset -6px -6px 14px rgba(255,255,255,0.95);}
.close-btn{background:#1a73e8;color:white;width:100%;margin-top:15px;border:none;border-radius:18px;padding:14px;font-weight:700;cursor:pointer;box-shadow:6px 6px 18px rgba(0,0,0,0.2),-6px -6px 18px rgba(255,255,255,0.5);transition:all 0.3s ease;}
.close-btn:hover{background:#155ab6;}

/* DASHBOARD */
.dashboard{padding:50px 60px;transition:margin-left 0.3s ease;}
.cards{display:flex;flex-wrap:wrap;gap:25px;margin-bottom:45px;justify-content:space-between;}
.card{background:#e6f0ff;border-radius:24px;padding:30px;text-align:center;box-shadow:10px 10px 25px rgba(0,0,0,0.07),-10px -10px 25px rgba(255,255,255,0.95);transition:transform 0.3s ease, box-shadow 0.3s ease;}
.card:hover{transform:translateY(-8px);box-shadow:14px 14px 28px rgba(0,0,0,0.12),-14px -14px 28px rgba(255,255,255,0.95);}
.card h2{font-size:20px;color:#1a73e8;}
.card p{font-size:26px;font-weight:800;color:#1a73e8;}

/* GRAPH */
.graph{background:#e6f0ff;border-radius:24px;padding:25px;box-shadow:10px 10px 25px rgba(0,0,0,0.07),-10px -10px 25px rgba(255,255,255,0.95);margin-bottom:45px;text-align:center;transition:all 0.3s ease;}
.graph canvas{max-width:480px;margin:0 auto;}

/* TRANSACTIONS */
.transactions{background:#e6f0ff;border-radius:24px;padding:25px;box-shadow:10px 10px 25px rgba(0,0,0,0.07),-10px -10px 25px rgba(255,255,255,0.95);margin-bottom:45px;}
.transaction-form{margin-bottom:20px;}
.transaction-form label{display:block;margin-top:10px;}
.transaction-form input,.transaction-form select{width:100%;padding:10px;border:none;border-radius:12px;margin-top:5px;background:#e6f0ff;box-shadow:inset 4px 4px 10px rgba(0,0,0,0.06),inset -4px -4px 10px rgba(255,255,255,0.95);}
.transaction-form button{margin-top:15px;cursor:pointer;border:none;border-radius:16px;padding:12px;background:#1a73e8;color:white;font-weight:700;width:100%;}
.transaction-form button:hover{background:#155ab6;}
table{width:100%;border-collapse:collapse;}
th,td{padding:14px;text-align:center;border-bottom:1px solid #d1d9e6;}
th{background:#1a73e8;color:white;font-weight:600;}
tr:hover{background:#dce8ff;}
.transactions button{padding:4px 10px;border:none;border-radius:8px;background:#1a73e8;color:white;cursor:pointer;}
.transactions button:hover{background:#155ab6;}

/* CRYPTO MODAL */
.crypto-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#f0f4f8;padding:30px;border-radius:24px;box-shadow:10px 10px 25px rgba(0,0,0,0.07),-10px -10px 25px rgba(255,255,255,0.95);z-index:500;display:none;min-width:300px;}
.crypto-modal h3{text-align:center;margin-bottom:20px;color:#1a73e8;}
.crypto-modal table{width:100%;border-collapse:collapse;}
.crypto-modal th,.crypto-modal td{padding:10px;text-align:center;border-bottom:1px solid #d1d9e6;}
.crypto-modal th{background:#1a73e8;color:white;}
.crypto-modal tr:hover{background:#dce8ff;}
.close-modal{margin-top:15px;background:#1a73e8;color:white;width:100%;border:none;padding:12px;border-radius:16px;cursor:pointer;}
.close-modal:hover{background:#155ab6;}
/* MOBILE RESPONSIVE */
@media screen and (max-width: 768px) {
  .dashboard, .transactions {padding: 20px;}
  .cards {flex-direction: column; gap: 20px;}
  .card {width: 100% !important;}
  .sidebar {width: 80%;}
  header {flex-direction: column; gap: 10px; padding: 15px;}
  .logo-title {font-size: 28px;}
  .nav-buttons {flex-wrap: wrap; justify-content: center;}
  table {display: block; overflow-x: auto; white-space: nowrap;}
  .graph canvas {max-width:100%;}
}

</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <img src="smartsaver.png" alt="Smart Saver Logo"/>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Profile</h3>
  <label>Name</label><input type="text" id="name" placeholder="Enter your name">
  <label>Email</label><input type="email" id="email" placeholder="Enter your email">
  <label>Mobile No</label><input type="text" id="mobile" placeholder="Enter mobile number">
  <label>DOB</label><input type="date" id="dob">
  <label>Monthly Income</label><input type="number" id="income" placeholder="Enter income">
  <button class="close-btn" onclick="toggleSidebar()">Close</button>
</div>

<!-- HEADER -->
<header>
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <div class="logo-area">
    <img src="smartsaver.png" alt="Logo">
    <span class="logo-title">Smart Saver</span>
  </div>
  <div class="nav-buttons">
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('transactionsSection')">Transactions</button>
    <button onclick="showSection('cryptoModal')">Crypto</button>
  </div>
</header>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="cards">
    <div class="card"><h2>Monthly Income</h2><p id="incomeValue">₹0</p></div>
    <div class="card"><h2>Expenses</h2><p id="expenseValue">₹0</p></div>
    <div class="card"><h2>Money Credited</h2><p id="creditValue">₹0</p></div>
    <div class="card"><h2>Crypto Savings</h2><p id="cryptoValue">₹0</p></div>
  </div>
  <div class="graph"><h2>Monthly Expense Overview</h2><canvas id="expenseChart" width="400" height="180"></canvas></div>
</div>

<!-- TRANSACTIONS SECTION -->
<div class="transactions" id="transactionsSection">
  <h2>Recent Transactions</h2>
  <div class="transaction-form">
    <h3 style="text-align:center;color:#1a73e8;">Add / Update Transaction</h3>
    <label>Category</label><input type="text" id="category" placeholder="E.g. Food, Salary">
    <label>Type</label><select id="type"><option value="Credit">Credit</option><option value="Debit">Debit</option></select>
    <label>Amount</label><input type="number" id="amount" placeholder="Enter amount">
    <label>Date</label><input type="date" id="tdate">
    <label>Save Spare Change to Crypto</label>
    <select id="cryptoType">
      <option value="Bitcoin">Bitcoin</option>
      <option value="Ethereum">Ethereum</option>
      <option value="USDT">USDT</option>
      <option value="Solana">Solana</option>
    </select>
    <button class="close-btn" onclick="addTransaction()">Add Transaction</button>
  </div>
  <table id="transactionTable">
    <tr><th>S.No</th><th>Category</th><th>Type</th><th>Date</th><th>Amount</th><th>Rounded</th><th>Saved to Crypto</th><th>Action</th></tr>
  </table>
</div>

<!-- CRYPTO MODAL -->
<div class="crypto-modal" id="cryptoModal">
  <h3>Crypto Savings</h3>
  <table id="cryptoTable"><tr><th>Crypto</th><th>Amount Saved</th></tr></table>
  <button class="close-modal" onclick="showSection('dashboard')">Close</button>
</div>

<script>
// SPLASH
setTimeout(()=>{
  document.getElementById("splash").style.animation="fadeOut 0.8s ease forwards";
  setTimeout(()=>{document.getElementById("splash").style.display="none";},800);
},2000);

// NAV FUNCTIONS
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("active");}
function showSection(id){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("transactionsSection").style.display="none";
  document.getElementById("cryptoModal").style.display="none";
  document.getElementById(id).style.display="block";
}

// DATA
let transactions=JSON.parse(localStorage.getItem("transactions"))||[];
let cryptoSavings=JSON.parse(localStorage.getItem("cryptoSavings"))||{};
let editingIndex=null;

// ---------------- DEMO DATA ----------------
if(transactions.length===0){
  document.getElementById("income").value=50000;
  transactions=[
    {category:"Salary", type:"Credit", amount:50000, rounded:50000, date:"2025-10-01", cryptoSaved:null, spare:0},
    {category:"Rent", type:"Debit", amount:15000, rounded:15000, date:"2025-10-02", cryptoSaved:null, spare:0},
    {category:"Food", type:"Debit", amount:1320, rounded:1325, date:"2025-10-03", cryptoSaved:"Bitcoin", spare:5},
    {category:"Entertainment", type:"Debit", amount:765, rounded:770, date:"2025-10-04", cryptoSaved:"Ethereum", spare:5},
    {category:"Freelance", type:"Credit", amount:12000, rounded:12000, date:"2025-10-05", cryptoSaved:null, spare:0},
    {category:"Shopping", type:"Debit", amount:1997, rounded:2000, date:"2025-10-06", cryptoSaved:"USDT", spare:3},
    {category:"Groceries", type:"Debit", amount:845, rounded:845, date:"2025-10-07", cryptoSaved:null, spare:0},
    {category:"Utilities", type:"Debit", amount:1760, rounded:1760, date:"2025-10-08", cryptoSaved:null, spare:0}
  ];
  cryptoSavings={"Bitcoin":5,"Ethereum":5,"USDT":3,"Solana":0};
  localStorage.setItem("transactions",JSON.stringify(transactions));
  localStorage.setItem("cryptoSavings",JSON.stringify(cryptoSavings));
}

// CHART
const ctx=document.getElementById("expenseChart").getContext("2d");
const chart=new Chart(ctx,{type:"bar",data:{labels:["Jan","Feb","Mar","Apr","May","Jun"],datasets:[{label:"Expenses",data:[0,0,0,0,0,0],backgroundColor:"#1a73e8",borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

// DASHBOARD UPDATE
function updateDashboard(){
  let income=parseInt(document.getElementById("income").value)||0;
  localStorage.setItem("income",income);
  let totalExpense=transactions.filter(t=>t.type=="Debit").reduce((a,b)=>a+b.rounded,0);
  let totalCredit=transactions.filter(t=>t.type=="Credit").reduce((a,b)=>a+b.rounded,0);
  document.getElementById("incomeValue").textContent="₹"+income;
  document.getElementById("expenseValue").textContent="₹"+totalExpense;
  document.getElementById("creditValue").textContent="₹"+totalCredit;
  let totalCrypto=Object.values(cryptoSavings).reduce((a,b)=>a+b,0);
  document.getElementById("cryptoValue").textContent="₹"+totalCrypto;

  // Chart
  let monthlyExpenses=[0,0,0,0,0,0];
  transactions.filter(t=>t.type=="Debit").forEach(t=>{
    let m=new Date(t.date).getMonth();
    if(m<6) monthlyExpenses[m]+=t.rounded;
  });
  chart.data.datasets[0].data=monthlyExpenses; chart.update();

  updateTransactionTable();
  updateCryptoTable();
}

// TRANSACTION TABLE
let addBtn = document.querySelector("#transactionsSection .close-btn");
function updateTransactionTable(){
  let table=document.getElementById("transactionTable");
  table.innerHTML='<tr><th>S.No</th><th>Category</th><th>Type</th><th>Date</th><th>Amount</th><th>Rounded</th><th>Saved to Crypto</th><th>Action</th></tr>';
  transactions.forEach((t,i)=>{
    table.innerHTML+=`<tr>
      <td>${i+1}</td><td>${t.category}</td><td>${t.type}</td><td>${t.date}</td>
      <td>₹${t.amount}</td><td>₹${t.rounded}</td>
      <td>${t.cryptoSaved?t.cryptoSaved+' (₹'+t.spare+')':'-'}</td>
      <td><button onclick="editTransaction(${i})">Edit</button></td>
    </tr>`;
  });
}

// CRYPTO TABLE
function updateCryptoTable(){
  let table=document.getElementById("cryptoTable");
  table.innerHTML='<tr><th>Crypto</th><th>Amount Saved</th></tr>';
  for(let k in cryptoSavings){table.innerHTML+=`<tr><td>${k}</td><td>₹${cryptoSavings[k]}</td></tr>`;}
}

// ADD / EDIT TRANSACTION
function addTransaction(){
  let cat=document.getElementById("category").value;
  let type=document.getElementById("type").value;
  let amt=parseInt(document.getElementById("amount").value);
  let date=document.getElementById("tdate").value;
  let crypto=document.getElementById("cryptoType").value;
  if(!cat||!amt||!date){alert("Fill all fields!");return;}
  let rounded=Math.ceil(amt/5)*5;
  let spare=rounded-amt;

  if(editingIndex!==null){
    if(transactions[editingIndex].cryptoSaved) cryptoSavings[transactions[editingIndex].cryptoSaved]-=transactions[editingIndex].spare;
    transactions[editingIndex]={category:cat,type:type,amount:amt,rounded:rounded,date:date,cryptoSaved:spare>0?crypto:null,spare:spare};
    if(spare>0) cryptoSavings[crypto]=(cryptoSavings[crypto]||0)+spare;
    editingIndex=null;
    addBtn.textContent="Add Transaction";
  } else {
    transactions.push({category:cat,type:type,amount:amt,rounded:rounded,date:date,cryptoSaved:spare>0?crypto:null,spare:spare});
    if(spare>0) cryptoSavings[crypto]=(cryptoSavings[crypto]||0)+spare;
  }

  localStorage.setItem("transactions",JSON.stringify(transactions));
  localStorage.setItem("cryptoSavings",JSON.stringify(cryptoSavings));

  document.getElementById("category").value="";
  document.getElementById("type").value="Credit";
  document.getElementById("amount").value="";
  document.getElementById("tdate").value="";
  document.getElementById("cryptoType").value="Bitcoin";

  updateDashboard();
  showSection("transactionsSection");
}

// EDIT TRANSACTION
function editTransaction(index){
  editingIndex=index;
  let t=transactions[index];
  document.getElementById("category").value=t.category;
  document.getElementById("type").value=t.type;
  document.getElementById("amount").value=t.amount;
  document.getElementById("tdate").value=t.date;
  document.getElementById("cryptoType").value=t.cryptoSaved||"Bitcoin";
  addBtn.textContent="Update Transaction";
}

// INCOME UPDATE
document.getElementById("income").addEventListener("input",updateDashboard);

// INITIAL LOAD
updateDashboard();
showSection("dashboard");
</script>
</body>
</html>
